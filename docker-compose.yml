version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshorty
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/urlshorty
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
